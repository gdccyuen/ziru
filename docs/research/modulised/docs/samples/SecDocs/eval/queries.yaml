# Ziru retrieval evaluation set — SecDocs corpus
# Generated from MinerU output (localhost:8000, backend=pipeline).
# Each query defines the returns a correct Ziru retrieval MUST produce.
version: 1
corpus:
  base_dir: "../"
  parsed_dir: "../parsed"
  attribute_keys: ["topic", "branch", "division", "section"]

grading:
  # A query passes only if ALL of the following hold for the top-k results:
  # 1. every document in expect.documents appears in the returned documents;
  # 2. every section path in expect.sections is matched by some returned
  #    section path, segment-wise: each expected heading segment appears in
  #    the returned " / "-joined path (order-insensitive);
  # 3. for every chunk in expect.chunks, at least one returned chunk has the
  #    same type and its content contains text_substr (case-insensitive);
  # 4. none of expect.must_not_documents appears in the returned documents.
  top_k: 8
  match_section_path: segment

queries:
  # ---------------------------------------------------------------- Cloud
  - id: SD-001
    query: "What are the four cloud deployment models?"
    intent: fact_retrieval
    filters: {}
    expect:
      documents:
        - "PG for Cloud Computing Security_EN.pdf"
      sections:
        - "Cloud Computing Security / 3. Introduction to Cloud Computing Security / 3.4 Cloud Deployment Models"
      chunks:
        - type: text
          text_substr: "There are four typical types of cloud deployment models"
      must_not_documents: []
    note: "Public, Private, Community, Hybrid — section 3.4."

  - id: SD-002
