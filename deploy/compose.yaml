services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ziru
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ziru"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --stop-writes-on-bgsave-error no
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    image: ziru:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &ziru_env
      MODE: api
      DATABASE_URL: postgresql+asyncpg://root:${POSTGRES_PASSWORD:-root123}@postgres:5432/ziru
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_REDIS_URL: redis://redis:6379/0
      S3_TYPE: filesystem
      S3_BUCKET_NAME: ziru-uploads
      S3_RESULTS_BUCKET: ziru-results
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_TEMP_PATH: /tmp/ziru
      TMP_PATH: /tmp/ziru
      OBJECT_STORAGE_LOCAL_ROOT: /data/storage
      USERS_DATA_PATH: /data/users
      PROVIDER_URL: http://host.docker.internal:8888/v1
      PROVIDER_KEY: ${PROVIDER_KEY:-}
      MINERU_URL: http://host.docker.internal:8000
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@ziru.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ENVIRONMENT: production
      APP_ENV: production
      LOG_LEVEL: INFO
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-10}
      CHAT_ANSWER_SYNTHESIS: ${CHAT_ANSWER_SYNTHESIS:-false}
      NORMAL_MODEL: ${NORMAL_MODEL:-}
      HIERARCHY_LLM_MODEL: ${HIERARCHY_LLM_MODEL:-}
      RETRIEVAL_PLANNER_MODEL: ${RETRIEVAL_PLANNER_MODEL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      OPENAI_CLIENT_TIMEOUT: ${OPENAI_CLIENT_TIMEOUT:-1800}
      SUMMARY_LLM_MAX_CONCURRENT: ${SUMMARY_LLM_MAX_CONCURRENT:-3}
      RETRIEVAL_PLANNER_THINKING_BUDGET: ${RETRIEVAL_PLANNER_THINKING_BUDGET:-4000}
      RETRIEVAL_WALLET_TOTAL_BUDGET: ${RETRIEVAL_WALLET_TOTAL_BUDGET:-200000}
      RETRIEVAL_WALLET_PER_RETRIEVE_STEP_BUDGET: ${RETRIEVAL_WALLET_PER_RETRIEVE_STEP_BUDGET:-40000}
      RETRIEVAL_DECOMPOSITION_MAX_STEPS: ${RETRIEVAL_DECOMPOSITION_MAX_STEPS:-5}
      RETRIEVAL_WORKFLOW_PARALLEL_MAX: ${RETRIEVAL_WORKFLOW_PARALLEL_MAX:-3}
      RETRIEVAL_AGENTIC_MAX_NAV_STEPS: ${RETRIEVAL_AGENTIC_MAX_NAV_STEPS:-6}
      RETRIEVAL_AGENTIC_LATENCY_BUDGET_MS: ${RETRIEVAL_AGENTIC_LATENCY_BUDGET_MS:-30000}
      RETRIEVAL_AGENTIC_TOKEN_BUDGET_TOTAL: ${RETRIEVAL_AGENTIC_TOKEN_BUDGET_TOTAL:-40000}
      RETRIEVAL_AGENTIC_PLANNING_RATIO: ${RETRIEVAL_AGENTIC_PLANNING_RATIO:-0.5}
      RETRIEVAL_AGENTIC_BOOTSTRAP_BUDGET: ${RETRIEVAL_AGENTIC_BOOTSTRAP_BUDGET:-2000}
      RETRIEVAL_AGENTIC_PER_DOC_MIN_SHARE: ${RETRIEVAL_AGENTIC_PER_DOC_MIN_SHARE:-1500}
      # Deterministic numbering-first heading hierarchy (Outline Quality is
      # derived on read; see ADR-0004).
      NUMBERING_FIRST_HIERARCHY: ${NUMBERING_FIRST_HIERARCHY:-false}
      OUTLINE_SANITY_THRESHOLD: ${OUTLINE_SANITY_THRESHOLD:-0.85}
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-5005}:5005"
    volumes:
      - ziru_storage:/data/storage
      - ziru_users:/data/users
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    restart: unless-stopped
    image: ziru:local
    environment:
      <<: *ziru_env
      MODE: worker
    volumes:
      - ziru_storage:/data/storage
      - ziru_users:/data/users
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Ziru.1 Phase 1 consolidation: the unified app is served here. It exposes all
  # five role-gated tabs (Query / Admin / Attributes / Jobs / Document Intake),
  # and the Admin tab includes the former admin console's users, API-keys and
  # webhooks screens.
  webui:
    restart: unless-stopped
    image: ziru:local
    environment:
      MODE: webui
      API_INTERNAL_URL: http://api:5005
    ports:
      - "${WEBUI_HOST_BIND:-127.0.0.1}:${WEBUI_HOST_PORT:-80}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ziru_storage:
  ziru_users:
