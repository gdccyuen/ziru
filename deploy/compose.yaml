services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ziru
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ziru"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --stop-writes-on-bgsave-error no
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    image: ziru:local
    environment: &ziru_env
      MODE: api
      DATABASE_URL: postgresql+asyncpg://root:${POSTGRES_PASSWORD:-root123}@postgres:5432/ziru
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_REDIS_URL: redis://redis:6379/0
      S3_TYPE: filesystem
      S3_BUCKET_NAME: ziru-uploads
      S3_RESULTS_BUCKET: ziru-results
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_TEMP_PATH: /tmp/ziru
      TMP_PATH: /tmp/ziru
      OBJECT_STORAGE_LOCAL_ROOT: /data/storage
      USERS_DATA_PATH: /data/users
      PROVIDER_URL: http://host.docker.internal:8888/v1
      PROVIDER_KEY: ${PROVIDER_KEY:-}
      MINERU_URL: http://host.docker.internal:8000
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@ziru.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ENVIRONMENT: production
      APP_ENV: production
      LOG_LEVEL: INFO
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      CHAT_ANSWER_SYNTHESIS: ${CHAT_ANSWER_SYNTHESIS:-false}
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-5005}:5005"
    volumes:
      - ziru_storage:/data/storage
      - ziru_users:/data/users
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    restart: unless-stopped
    image: ziru:local
    environment:
      <<: *ziru_env
      MODE: worker
    volumes:
      - ziru_storage:/data/storage
      - ziru_users:/data/users
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    restart: unless-stopped
    image: ziru:local
    environment:
      MODE: admin
      API_INTERNAL_URL: http://api:5005
    ports:
      - "${ADMIN_HOST_BIND:-127.0.0.1}:${ADMIN_HOST_PORT:-81}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10

  webui:
    restart: unless-stopped
    image: ziru:local
    environment:
      MODE: webui
      API_INTERNAL_URL: http://api:5005
    ports:
      - "${WEBUI_HOST_BIND:-127.0.0.1}:${WEBUI_HOST_PORT:-80}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ziru_storage:
  ziru_users:
